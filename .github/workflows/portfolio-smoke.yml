name: Python graph algorithm tests

on:
  push:
    branches:
      - docs/recruiter-portfolio-improvement
  pull_request:

jobs:
  algorithms:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install headless Qt system libraries
        run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0 libxkbcommon-x11-0
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Check Python syntax
        run: python -m compileall -q app front server.py
      - name: Run tests headlessly
        run: python -m pytest -q tests/
